server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
