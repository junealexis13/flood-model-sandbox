# No secrets. DATA_DIR is set here. Optional overrides are documented in .env.example.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Host 8000 is taken by sinag_web_platform. Container port stays 8000;
      # nginx in the web service still proxies to api:8000 on the compose network.
      - "127.0.0.1:8010:8000"
    environment:
      DATA_DIR: /app/data
    volumes:
      - hand_data:/app/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  hand_data:
